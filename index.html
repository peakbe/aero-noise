<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard ND / METAR / FIDS — PRO+++</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Style avionique -->
  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #0ff;
      font-family: monospace;
    }

    #map {
      width: 100vw;
      height: 60vh;
      border-bottom: 2px solid #0ff;
    }

    .panel {
      padding: 10px;
      border-bottom: 1px solid #0ff;
    }

    .float-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #111;
      border: 2px solid #0ff;
      color: #0ff;
      padding: 6px 12px;
      font-family: monospace;
      cursor: pointer;
      border-radius: 4px;
    }
    .float-btn:hover {
      border-color: lime;
      color: lime;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 6px;
      color: #0ff;
    }

    .data-box {
      background: #111;
      padding: 10px;
      border: 1px solid #0ff;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <!-- Carte ND / Radar -->
  <div id="map"></div>

  <!-- Bouton Recentrer -->
  <button id="btn-recenter" class="float-btn">Recentrer</button>

  <!-- Sélecteur d’aéroport -->
  <div class="panel">
    <label for="airport-select">Aéroport :</label>
    <select id="airport-select">
      <option value="EBLG">EBLG — Liège</option>
      <option value="EBCI">EBCI — Charleroi</option>
    </select>
  </div>

  <!-- METAR / TAF -->
  <div class="panel">
    <div class="section-title">METAR</div>
    <div id="metar-box" class="data-box">Chargement…</div>

    <div class="section-title">TAF</div>
    <div id="taf-box" class="data-box">Chargement…</div>
  </div>

  <!-- Météo OpenWeather -->
  <div class="panel">
    <div class="section-title">Météo</div>
    <div id="weather-box" class="data-box">Chargement…</div>
  </div>

  <!-- FIDS AirLabs -->
  <div class="panel">
    <div class="section-title">Arrivées</div>
    <div id="arrivals-box" class="data-box">Chargement…</div>

    <div class="section-title">Départs</div>
    <div id="departures-box" class="data-box">Chargement…</div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
