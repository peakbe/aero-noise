<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>ND / MCDU / METAR / FIDS — Airbus A320 PRO+++</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

  <!-- Style Jeppesen PRO+++ -->
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- ================================
       SIDEBAR MCDU — Airbus A320 PRO+++
  ================================= -->
  <div id="sidebar-mcdu">

    <div class="mcdu-title">MCDU / ND — Jeppesen PRO+++</div>

    <!-- WIND -->
    <div id="mcdu-wind" class="mcdu-box"></div>

    <!-- RWY -->
    <div id="mcdu-rwy" class="mcdu-box"></div>

    <!-- TAF TRENDS -->
    <div id="mcdu-trend" class="mcdu-box"></div>

    <!-- WIND SPEED (m/s) -->
    <div id="mcdu-wind-ms" class="mcdu-box"></div>

    <!-- ROSE ND -->
    <canvas id="mcdu-rose" width="220" height="220"></canvas>

    <!-- APT SELECTOR -->
    <div class="mcdu-box">
      APT :
      <select id="airport-select" class="mcdu-select">
        <option value="EBLG">EBLG — Liège</option>
        <option value="EBCI">EBCI — Charleroi</option>
      </select>
    </div>

    <!-- BUTTONS -->
    <div id="mcdu-buttons-container">
      <button id="btn-recenter" class="mcdu-btn">RCL</button>
      <button id="btn-refresh" class="mcdu-btn">REFRESH</button>
      <button id="btn-sono" class="mcdu-btn">SONO</button>
    </div>

    <!-- FIDS CONFIRMÉS -->
    <div class="mcdu-box mcdu-fids">
      <div class="mcdu-fids-title">ARRIVALS — 10 CONFIRMED</div>
      <div id="mcdu-fids-arr"></div>

      <div class="mcdu-fids-title">DEPARTURES — 10 CONFIRMED</div>
      <div id="mcdu-fids-dep"></div>
    </div>

  </div>

  <!-- ================================
       ND MAP — Airbus Navigation Display
  ================================= -->
  <div id="map"></div>

  <!-- ================================
       PANELS METAR / TAF / WX / FIDS
  ================================= -->

  <div class="panel">
    <h2>METAR</h2>
    <div id="metar-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>TAF</h2>
    <div id="taf-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Météo (OpenWeather)</h2>
    <div id="weather-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Arrivées (FUSION AirLabs / AviationStack / OpenSky)</h2>
    <div id="arrivals-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Départs (FUSION AirLabs / AviationStack / OpenSky)</h2>
    <div id="departures-box" class="data-box"></div>
  </div>

  <!-- ================================
       SCRIPTS
  ================================= -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
