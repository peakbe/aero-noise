/* =========================================================
   CARTE
========================================================= */

const map = L.map("map", {
  zoomControl: true,
  preferCanvas: true
}).setView([50.56, 4.95], 9);

/* =========================================================
   OUTILS
========================================================= */

function degToRad(v) {
  return v * Math.PI / 180;
}

function radToDeg(v) {
  return v * 180 / Math.PI;
}

function normalizeHeading(v) {
  return ((v % 360) + 360) % 360;
}

function angleDifference(a, b) {
  let d = Math.abs(normalizeHeading(a) - normalizeHeading(b));
  return Math.min(d, 360 - d);
}

function windCardinal(deg) {

  const dirs = [
    "N","NNE","NE","ENE",
    "E","ESE","SE","SSE",
    "S","SSO","SO","OSO",
    "O","ONO","NO","NNO"
  ];

  return dirs[
    Math.round(normalizeHeading(deg) / 22.5) % 16
  ];
}

function runwayForWind(airport, windFrom) {

  let best = airport.runways[0];
  let bestDiff = Infinity;

  for (const runway of airport.runways) {

    const diff = angleDifference(
      windFrom,
      runway.heading
    );

    if (diff < bestDiff) {
      best = runway;
      bestDiff = diff;
    }
  }

  return {
    runway: best,
    difference: bestDiff
  };
}


/*
 * Projection simple permettant de dessiner une piste
 * à partir d'un centre, d'un cap et d'une distance.
 */
function destinationPoint(lat, lon, bearing, distanceKm) {

  const R = 6371;

  const φ1 = degToRad(lat);
  const λ1 = degToRad(lon);
  const θ = degToRad(bearing);
  const δ = distanceKm / R;

  const φ2 = Math.asin(
    Math.sin(φ1) * Math.cos(δ) +
    Math.cos(φ1) * Math.sin(δ) * Math.cos(θ)
  );

  const λ2 = λ1 + Math.atan2(
    Math.sin(θ) * Math.sin(δ) * Math.cos(φ1),
    Math.cos(δ) - Math.sin(φ1) * Math.sin(φ2)
  );

  return [
    radToDeg(φ2),
    radToDeg(λ2)
  ];
}

function drawAirport(airport) {

  const marker = L.circleMarker(
    [airport.lat, airport.lon],
    {
      radius: 8,
      color: "#ffffff",
      weight: 2,
      fillColor: "#153a61",
      fillOpacity: 1
    }
  )
  .bindTooltip(
    `${airport.name} (${airport.code || ""})`,
    {
      permanent: true,
      direction: "top",
      className: "airport-label"
    }
  );

  marker.addTo(layers.airports);
}


function drawRunways(airport) {

  airport.runways.forEach(runway => {

    const a = destinationPoint(
      airport.lat,
      airport.lon,
      runway.heading,
      3
    );

    const b = destinationPoint(
      airport.lat,
      airport.lon,
      runway.heading + 180,
      3
    );

    const line = L.polyline(
      [a, b],
      {
        color: "#50677f",
        weight: 3,
        opacity: .8,
        dashArray: "8 7"
      }
    );

    line.runwayId = runway.id;

    line.bindTooltip(
      `Piste ${runway.id} · cap ${runway.heading}°`,
      {
        sticky: true,
        className: "map-label"
      }
    );

    line.addTo(layers.runways);

    runway.mapLine = line;

    const labelPoint = destinationPoint(
      airport.lat,
      airport.lon,
      runway.heading,
      3.2
    );

    L.marker(
      labelPoint,
      {
        icon: L.divIcon({
          className: "",
          html: `<div class="map-label">${runway.id}</div>`,
          iconSize: [30, 20],
          iconAnchor: [15, 10]
        })
      }
    ).addTo(layers.runways);

  });

}


function drawSonometers(airport) {

  airport.sonometers.forEach(sensor => {

    const marker = L.circleMarker(
      [sensor.lat, sensor.lon],
      {
        radius: 6,
        color: "#777",
        weight: 1,

      </small>
    `);

    marker.sensorId = sensor.id;
    marker.addTo(layers.sonometers);

    sensor.marker = marker;

  });

}


/* =========================================================
   WEATHER
========================================================= */

async function fetchWeather(airport) {

  const url =
    "https://api.open-meteo.com/v1/forecast" +
    `?latitude=${airport.lat}` +
    `&longitude=${airport.lon}` +
    "&current=temperature_2m,relative_humidity_2m," +
    "apparent_temperature,precipitation,weather_code," +
    "wind_speed_10m,wind_direction_10m,wind_gusts_10m" +
    "&hourly=temperature_2m,wind_speed_10m," +
    "wind_direction_10m,wind_gusts_10m,precipitation" +
    "&past_hours=24" +
    "&forecast_hours=48" +
    "&timezone=Europe%2FBrussels";

  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("Erreur Open-Meteo");
  }

  return await response.json();
}


/* =========================================================
   ROSE DES VENTS
========================================================= */

function drawWindRose(canvas, directions) {

  const ctx = canvas.getContext("2d");

  const dpr = window.devicePixelRatio || 1;

  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;

  const radius =
    Math.min(w, h) * .34;

  ctx.strokeStyle = "#29445d";
  ctx.lineWidth = 1;

  for (let i = 1; i <= 3; i++) {

    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      radius * i / 3,
      0,
      Math.PI * 2
    );

    ctx.stroke();
  }

  const labels = [
    ["N",0],
    ["E",90],
    ["S",180],
    ["O",270]
  ];

  ctx.fillStyle = "#9bb1c5";
  ctx.font = "10px system-ui";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  labels.forEach(([label, angle]) => {

    const a = degToRad(angle - 90);

    ctx.fillText(
      label,
      cx + Math.cos(a) * (radius + 14),
      cy + Math.sin(a) * (radius + 14)
    );

  });


  const max = Math.max(
    ...directions.map(v => v)
  ) || 1;


  for (let i = 0; i < 16; i++) {

    const angle = i * 22.5;

    const value = directions[i] || 0;

    const len =
      radius * .9 * (value / max);

    const a =
      degToRad(angle - 90);

    ctx.beginPath();

    ctx.moveTo(cx, cy);

    ctx.lineTo(
      cx + Math.cos(a) * len,
      cy + Math.sin(a) * len
    );

    ctx.strokeStyle =
      `rgba(54,224,208,${.25 + .7 * value / max})`;

    ctx.lineWidth = 5;

    ctx.stroke();
  }

  ctx.fillStyle = "#36e0d0";

  ctx.beginPath();

  ctx.arc(
    cx,
    cy,
    3,
    0,
    Math.PI * 2
  );

  ctx.fill();

}


/*
 * Conversion des directions météo en 16 secteurs.
 */
function buildWindRose(weather) {

  const result = new Array(16).fill(0);

  const dirs =
    weather.hourly.wind_direction_10m || [];

  const speeds =
    weather.hourly.wind_speed_10m || [];

  for (let i = 0; i < dirs.length; i++) {

    if (dirs[i] == null) continue;

    const sector =
      Math.round(dirs[i] / 22.5) % 16;

    result[sector] +=
      speeds[i] || 0;
  }

  return result;

}


/* =========================================================
   TENDANCE
========================================================= */

function drawTrend(canvas, weather) {

  const ctx = canvas.getContext("2d");

  const dpr = window.devicePixelRatio || 1;

  const rect = canvas.getBoundingClientRect();

  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;

  ctx.scale(dpr, dpr);

  const w = rect.width;
  const h = rect.height;

  ctx.clearRect(0, 0, w, h);

  const temps =
    weather.hourly.temperature_2m.slice(0, 24);

  const winds =
    weather.hourly.wind_speed_10m.slice(0, 24);

  const maxTemp =
    Math.max(...temps);

  const minTemp =
    Math.min(...temps);

  const maxWind =
    Math.max(...winds, 1);

  const left = 32;
  const right = 12;
  const top = 12;
  const bottom = 25;

  const plotW = w - left - right;
  const plotH = h - top - bottom;


  ctx.strokeStyle = "#203751";
  ctx.lineWidth = 1;

  for (let i = 0; i <= 4; i++) {

    const y =
      top + plotH * i / 4;

    ctx.beginPath();

    ctx.moveTo(left, y);
    ctx.lineTo(w - right, y);

    ctx.stroke();

  }


  function x(i) {

    return left +
      plotW *
      i /
      Math.max(temps.length - 1, 1);

  }


  function yTemp(value) {

    const range =
      Math.max(maxTemp - minTemp, 1);

    return top +
      plotH -
      ((value - minTemp) / range) *
      plotH;

  }


  function yWind(value) {

    return top +
      plotH -
      (value / maxWind) *
      plotH;

  }


  // Température

  ctx.beginPath();

  temps.forEach((value, i) => {

    const px = x(i);
    const py = yTemp(value);

    if (i === 0) {
      ctx.moveTo(px, py);
    } else {
      ctx.lineTo(px, py);
    }

  });

  ctx.strokeStyle = "#ffb020";
  ctx.lineWidth = 2;
  ctx.stroke();


  // Vent

  ctx.beginPath();

  winds.forEach((value, i) => {

    const px = x(i);
    const py = yWind(value);

    if (i === 0) {
      ctx.moveTo(px, py);
    } else {
      ctx.lineTo(px, py);
    }

  });

  ctx.strokeStyle = "#36a3ff";
  ctx.lineWidth = 2;
  ctx.stroke();


  ctx.fillStyle = "#ffb020";
  ctx.font = "9px system-ui";

  ctx.fillText(
    "Température",
    8,
    10
  );

  ctx.fillStyle = "#36a3ff";

  ctx.fillText(
    "Vent",
    8,
    22
  );

}

/* =========================================================
   PISTES
========================================================= */

function updateRunways(airportCode, selected) {

  const airport =
    AIRPORTS[airportCode];

  const container =
    document.getElementById(
      `${airportCode}-runways`
    );

  container.innerHTML = "";

  airport.runways.forEach(runway => {

    const card =
      document.createElement("div");

    card.className =
      "runway-card" +
      (runway.id === selected.runway.id
        ? " selected"
        : "");

    card.innerHTML = `

      <div class="runway-number">
        Piste ${runway.id}
      </div>

      <div class="runway-heading">
        Cap ${runway.heading}°
      </div>

      ${
        runway.id === selected.runway.id
        ? `<div class="runway-reason">
             ✓ Sélectionnée
           </div>`
        : ""
      }

    `;

    container.appendChild(card);


    if (runway.mapLine) {

      runway.mapLine.setStyle({

        color:
          runway.id === selected.runway.id
            ? "#18d47b"
            : "#50677f",

        weight:
          runway.id === selected.runway.id
            ? 6
            : 3,

        opacity:
          runway.id === selected.runway.id
            ? 1
            : .65,

        dashArray:
          runway.id === selected.runway.id
            ? null
            : "8 7"

      });

    }

  });

}


/* =========================================================
   SONOMETRES
========================================================= */

function updateSonometers(
  airportCode,
  runwayId
) {

  const airport =
    AIRPORTS[airportCode];

  const conditions =
    airport.conditions[runwayId];

  const container =
    document.getElementById(
      `${airportCode}-sonometers`
    );

  container.innerHTML = "";


  airport.sonometers.forEach(sensor => {

    let status = "red";

    if (
      conditions.green.includes(sensor.id)
    ) {
      status = "green";
    }

    const div =
      document.createElement("div");

    div.className =
      `sono ${status}`;

    div.innerHTML = `
      <div class="sono-id">${sensor.id}</div>
      <div>
        ${status === "green"
          ? "VERT"
          : "ROUGE"}
      </div>
    `;

    div.title =
      `${sensor.id} — ${sensor.address}`;

    container.appendChild(div);


    if (sensor.marker) {

      sensor.marker.setStyle({

        color:
          status === "green"
            ? "#18d47b"
            : "#ff4d5e",

        fillColor:
          status === "green"
            ? "#18d47b"
            : "#ff4d5e",

        radius: 7,

        fillOpacity: .95

      });

    }

  });

}


/* =========================================================
   METEO + SELECTION PISTE
========================================================= */

async function updateAirportWeather(
  airportCode
) {

  const airport =
    AIRPORTS[airportCode];

  try {

    const weather =
      await fetchWeather(airport);

    airportState[airportCode] = {
      weather
    };


    const current =
      weather.current;

    const wind =
      current.wind_direction_10m;

    const selection =
      runwayForWind(
        airport,
        wind
      );

    airportState[airportCode].runway =
      selection;


    document.getElementById(
      `${airportCode}-runway`
    ).textContent =
      `Piste ${selection.runway.id}`;


    document.getElementById(
      `${airportCode}-wind`
    ).textContent =
      `${Math.round(current.wind_speed_10m)} km/h`;


    document.getElementById(
      `${airportCode}-wind-dir`
    ).textContent =
      `${Math.round(wind)}° ${windCardinal(wind)} · vent de face piste ${selection.runway.id}`;


    const arrow =
      document.getElementById(
        `${airportCode}-wind-arrow`
      );

    arrow.textContent = "↑";

    arrow.style.transform =
      `rotate(${wind}deg)`;


    document.getElementById(
      `${airportCode}-temp`
    ).textContent =
      `${Math.round(current.temperature_2m)}°C`;


    document.getElementById(
      `${airportCode}-gust`
    ).textContent =
      `${Math.round(current.wind_gusts_10m)} km/h`;


    document.getElementById(
      `${airportCode}-humidity`
    ).textContent =
      `${Math.round(current.relative_humidity_2m)}%`;


    document.getElementById(
      `${airportCode}-condition`
    ).textContent =
      weatherText(current.weather_code);


    updateRunways(
      airportCode,
      selection
    );


    updateSonometers(
      airportCode,
      selection.runway.id
    );


    drawTrend(
      document.getElementById(
        `${airportCode}-trend`
      ),
      weather
    );


    drawWindRose(
      document.getElementById(
        `${airportCode}-rose`
      ),
      buildWindRose(weather)
    );


  } catch (error) {

    console.error(
      airportCode,
      error
    );

    document.getElementById(
      `${airportCode}-condition`
    ).textContent =
      "Météo indisponible";

  }

}

const flightState = {};


async function fetchFlights(
  airportCode
) {

  try {

    const response =
      await fetch(
        `${CONFIG.flightApi}?airport=${airportCode}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error("Flight API unavailable");
    }

    const data =
      await response.json();

    return {

      arrivals:
        (data.arrivals || []).slice(0, 10),

      departures:
        (data.departures || []).slice(0, 10)

    };

  } catch {

    /*
     * Fallback démonstration.
     * Remplacer par l'API réelle en production.
     */

    const d =
      DEMO_FLIGHTS[airportCode];

    return {

      arrivals:
        d.arrivals.map(
          f => ({
            time:f[0],
            callsign:f[1],
            airline:f[2],
            origin:f[3],
            destination:airportCode,
            status:f[4]
          })
        ),

      departures:
        d.departures.map(
          f => ({
            time:f[0],
            callsign:f[1],
            airline:f[2],
            origin:airportCode,
            destination:f[3].split("→")[1]?.trim() || "",
            status:f[4]
          })
        )

    };

  }

}


function renderFlights(
  airportCode,
  type
) {

  const data =
    flightState[airportCode];

  if (!data) return;

  const list =
    document.getElementById(
      `${airportCode}-flights`
    );

  list.innerHTML = "";


  data[type]
    .slice(0,10)
    .forEach(flight => {

      const div =
        document.createElement("div");

      div.className = "flight";

      const route =
        type === "arrivals"
          ? `${flight.origin || "—"} → ${airportCode}`
          : `${airportCode} → ${flight.destination || "—"}`;

      div.innerHTML = `

        <div class="flight-time">
          ${flight.time || "--:--"}
        </div>

        <div class="flight-main">

          <div class="flight-code">
            ${flight.callsign || "—"}
          </div>

          <div class="flight-route">
            ${flight.airline || ""} · ${route}
          </div>

        </div>

        <div class="flight-status">
          ${flight.status || "Prévu"}
        </div>

      `;

      list.appendChild(div);

    });


  document.getElementById(
    `${airportCode}-arrivals-tab`
  ).classList.toggle(
    "active",
    type === "arrivals"
  );


  document.getElementById(
    `${airportCode}-departures-tab`
  ).classList.toggle(
    "active",
    type === "departures"
  );

}


function showFlights(
  airportCode,
  type
) {

  renderFlights(
    airportCode,
    type
  );

}


/* =========================================================
   INITIALISATION
========================================================= */

function initializeMap() {

  Object.entries(AIRPORTS)
    .forEach(([code, airport]) => {

      airport.code = code;

      createAirportPanel(code);

      drawAirport(airport);

      drawRunways(airport);

      drawSonometers(airport);

    });


  const allPoints = [];


  Object.values(AIRPORTS)
    .forEach(airport => {

      allPoints.push(
        [airport.lat, airport.lon]
      );

      airport.sonometers
        .forEach(sensor => {

          allPoints.push(
            [sensor.lat, sensor.lon]
          );

        });

    });


  map.fitBounds(
    L.latLngBounds(allPoints),
    {
      padding: [20,20]
    }
  );

}


/* =========================================================
   CHARGEMENT GLOBAL
========================================================= */

async function loadAll() {

  const timestamp =
    new Date();

  document.getElementById(
    "lastUpdate"
  ).textContent =
    `Mise à jour ${timestamp.toLocaleTimeString(
      "fr-BE",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    )}`;


  for (
    const airportCode of Object.keys(AIRPORTS)
  ) {

    await updateAirportWeather(
      airportCode
    );

    flightState[airportCode] =
      await fetchFlights(
        airportCode
      );

    renderFlights(
      airportCode,
      "arrivals"
    );

  }

}

        drawWindRose(
          document.getElementById(
