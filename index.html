<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard ND / METAR / FIDS</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- SIDEBAR MCDU -->
  <div id="sidebar-mcdu">

    <div class="mcdu-title">MCDU / ND — Jeppesen PRO+++</div>

    <div id="mcdu-wind" class="mcdu-box"></div>
    <div id="mcdu-rwy" class="mcdu-box"></div>
    <div id="mcdu-trend" class="mcdu-box"></div>

    <canvas id="mcdu-rose" width="220" height="220"></canvas>

    <!-- ✔ Sélecteur d’aéroport intégré dans le MCDU -->
    <div class="mcdu-box">
      APT :
      <select id="airport-select" class="mcdu-select">
        <option value="EBLG">EBLG — Liège</option>
        <option value="EBCI">EBCI — Charleroi</option>
      </select>
    </div>

  </div>


  <h1>ND / METAR / FIDS — EBLG / EBCI</h1>

  <div id="map"></div>
  <button id="btn-recenter">RECENTRER</button>

  <!-- ❌ Ancien sélecteur supprimé (il passait derrière la carte)
  <div>
    <label for="airport-select">Aéroport :</label>
    <select id="airport-select">
      <option value="EBLG">EBLG — Liège</option>
      <option value="EBCI">EBCI — Charleroi</option>
    </select>
  </div>
  -->

  <div class="panel">
    <h2>METAR</h2>
    <div id="metar-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>TAF</h2>
    <div id="taf-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Météo (OpenWeather)</h2>
    <div id="weather-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Arrivées (AirLabs)</h2>
    <div id="arrivals-box" class="data-box"></div>
  </div>

  <div class="panel">
    <h2>Départs (AirLabs)</h2>
    <div id="departures-box" class="data-box"></div>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="map.js"></script>
  <script type="module" src="app.js"></script>

</body>
</html>
